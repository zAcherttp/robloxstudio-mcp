# Builds the server and the plugin and runs the offline tests on all three desktop platforms.
# Nothing here starts Studio: the live suites (npm run test:e2e and friends) need a signed-in
# Studio and stay manual. What this settles is that a teammate on Windows, macOS or Linux can
# clone, build and get a green `npm test` before they open Studio at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio-plugin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix studio-plugin
      - run: npm run build
      # --build-only writes studio-plugin/MCPPlugin.rbxmx without copying it into a Plugins folder.
      - run: npm run build:plugin:artifact
      - run: npm test
